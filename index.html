<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F12 Scanner</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #131722;
    --border: #232838;
    --text: #e6e9f0;
    --muted: #8992a8;
    --accent: #5b8cff;
    --critical: #ff4d5e;
    --high: #ff8a3d;
    --medium: #ffc94d;
    --low: #6fcf97;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .scan-form {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .summary-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .summary-stat { flex: 1; min-width: 100px; text-align: center; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px; }
  .summary-stat .num { font-size: 24px; font-weight: 700; }
  .summary-stat .label { font-size: 12px; color: var(--muted); }
  .finding {
    border-left: 3px solid var(--border);
    padding: 10px 12px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.02);
    border-radius: 4px;
  }
  .finding.kritiek { border-color: var(--critical); }
  .finding.hoog { border-color: var(--high); }
  .finding.medium { border-color: var(--medium); }
  .finding.laag { border-color: var(--low); }
  .finding-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .badge.kritiek { background: var(--critical); color: #200; }
  .badge.hoog { background: var(--high); color: #200; }
  .badge.medium { background: var(--medium); color: #200; }
  .badge.laag { background: var(--low); color: #002; }
  .finding-source { font-size: 12px; color: var(--muted); word-break: break-all; }
  .finding-preview { font-family: monospace; font-size: 13px; margin-top: 6px; color: var(--text); }
  .header-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .header-row:last-child { border-bottom: none; }
  .ok { color: var(--low); }
  .missing { color: var(--critical); }
  .empty-state { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
  #status { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .error-box { background: rgba(255,77,94,0.1); border: 1px solid var(--critical); color: var(--critical); padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔍 F12 Scanner</h1>
  <p class="subtitle">Vind blootgestelde API keys, secrets en ontbrekende security headers op een publieke webpagina.</p>

  <form class="scan-form" id="scanForm">
    <input type="text" id="urlInput" placeholder="https://jouwsite.com" required autocomplete="off">
    <button type="submit" id="scanBtn">Scan</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
