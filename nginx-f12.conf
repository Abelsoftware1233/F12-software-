# /etc/nginx/sites-available/f12.abelsoftware123.com
#
# Let op: deze versie gaat uit van een platte structuur op de server:
# /var/www/f12/ met daarin frontend_index.html, frontend_script.js direct
# (geen frontend/ submap). index.html moet wel "index.html" heten voor
# nginx's index-directive, dus hernoem frontend_index.html -> index.html
# op de server, of pas de index-regel hieronder aan.
#
# Activeer met: sudo ln -s /etc/nginx/sites-available/f12.abelsoftware123.com /etc/nginx/sites-enabled/
# Daarna: sudo nginx -t && sudo systemctl reload nginx
#
# Draai eerst certbot --nginx -d f12.abelsoftware123.com voor de cert-paden.

server {
    listen 80;
    server_name f12.abelsoftware123.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name f12.abelsoftware123.com;

    ssl_certificate     /etc/letsencrypt/live/f12.abelsoftware123.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/f12.abelsoftware123.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /var/www/f12;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
